<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Установка KidsGuard</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0B1220; color: #fff; margin: 0; padding: 24px; }
  .card { max-width: 420px; margin: 40px auto; background: rgba(255,255,255,0.06); border-radius: 16px; padding: 28px; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #b8c2d0; font-size: 14px; line-height: 1.5; }
  a.install {
    display: inline-block; margin-top: 20px; padding: 14px 28px;
    background: #3DDAD7; color: #04201e; font-weight: 600; text-decoration: none;
    border-radius: 999px; font-size: 17px;
  }
  .note { margin-top: 24px; font-size: 12px; color: #7c8797; }
</style>
</head>
<body>
  <div class="card">
    <h1>KidsGuard</h1>
    <p>Установка вне App Store, только для устройств, добавленных в профиль (iPad и iPhone Андрея).</p>
    <a class="install" href="itms-services://?action=download-manifest&url=https://zakabluk.github.io/kidsguard-install/manifest.plist">Установить</a>
    <p class="note">Откройте эту страницу в Safari на устройстве. После установки: Настройки → Основные → VPN и управление устройством → доверять разработчику (если попросит).</p>
  </div>
</body>
</html>
